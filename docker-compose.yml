version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: skema_postgres
    environment:
      POSTGRES_USER: skema
      POSTGRES_PASSWORD: skema
      POSTGRES_DB: skema_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skema"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Skema API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skema_api
    environment:
      DATABASE_URL: postgresql://skema:skema@postgres:5432/skema_db
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: python -m skema.api.main

volumes:
  postgres_data:
