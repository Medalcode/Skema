<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skema - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        header h1 {
            font-size: 28px;
            color: #667eea;
        }
        
        nav {
            display: flex;
            gap: 10px;
        }
        
        nav a {
            padding: 10px 20px;
            background: #f0f0f0;
            color: #333;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        nav a:hover, nav a.active {
            background: #667eea;
            color: white;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .card h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #667eea;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        
        .metric {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }
        
        .metric-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .badge.high {
            background: #fee;
            color: #c33;
        }
        
        .badge.medium {
            background: #fef3cd;
            color: #856404;
        }
        
        .badge.low {
            background: #d4edda;
            color: #155724;
        }
        
        .badge.high-confidence {
            background: #d4edda;
            color: #155724;
        }
        
        .badge.low-confidence {
            background: #fee;
            color: #c33;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        table th {
            background: #f9f9f9;
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid #667eea;
            font-weight: 600;
            color: #667eea;
        }
        
        table td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        table tr:hover {
            background: #f9f9f9;
        }
        
        .action-button {
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin: 0 4px;
            transition: all 0.3s;
        }
        
        .action-button:hover {
            background: #764ba2;
        }
        
        .action-button.secondary {
            background: #ccc;
            color: #333;
        }
        
        .action-button.secondary:hover {
            background: #999;
        }
        
        .status-good {
            color: #27ae60;
            font-weight: bold;
        }
        
        .status-warning {
            color: #f39c12;
            font-weight: bold;
        }
        
        .status-critical {
            color: #e74c3c;
            font-weight: bold;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        
        .modal-content h2 {
            margin-bottom: 15px;
            color: #667eea;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔷 Skema Dashboard</h1>
            <nav>
                <a href="/" class="active">Inicio</a>
                <a href="/review">Revisión</a>
                <a href="/metrics">Métricas</a>
            </nav>
        </header>
        
        {% block content %}{% endblock %}
        
        <footer class="footer">
            <p>Skema - Sistema Inteligente de Clasificación | <a href="#" style="color: white;">Documentación</a></p>
        </footer>
    </div>
    
    <script>
        function openModal(id) {
            document.getElementById(id).classList.add('show');
        }
        
        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }
        
        function submitFeedback(classificationId) {
            const category = document.getElementById('feedback-category').value;
            const isCorrect = document.getElementById('feedback-correct').checked;
            const notes = document.getElementById('feedback-notes').value;
            
            fetch('/api/feedback', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    classification_id: classificationId,
                    corrected_category: category,
                    is_correct: isCorrect,
                    notes: notes
                })
            }).then(r => r.json()).then(data => {
                alert('Feedback guardado');
                closeModal('feedback-modal');
                location.reload();
            });
        }
    </script>
</body>
</html>
